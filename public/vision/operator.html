<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIEANS Vision · 操作员运行平台</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="sieans-theme.css"><link rel="stylesheet" href="form-editors.css"><link rel="stylesheet" href="hmi-ui.css"><link rel="stylesheet" href="operator.css"><script src="/auth/session-ui.js"></script></head>
<body class="operator-shell runtime custom-hmi"><header class="operator-header"><img src="assets/sieans-logo.webp" alt="SIEANS"><div><h1>视觉运行平台</h1><p id="operator-identity">正在连接</p></div><span id="operator-project">等待已发布方案</span><button id="operator-refresh">刷新方案</button></header>
<nav class="operator-toolbar" aria-label="运行操作"><button id="operator-run" class="primary" disabled>运行已发布方案</button><button id="operator-continuous" disabled hidden>启动连续检测</button><button id="stop" disabled>停止运行</button><label>本次输入图像<input id="operator-image" type="file" accept="image/*"></label><button id="operator-clear">清除文件输入</button><span id="operator-version"></span></nav>
<main><details class="operator-cloud-input"><summary>本次点云文件输入</summary><div class="operator-cloud-fields"><label>点云文件<input id="operator-cloud-file" type="file" accept=".ply,.pcd,.xyz,.xyzn,.xyzrgb,.pts"></label><label>原始单位<select id="operator-cloud-unit"><option value="">请选择</option><option value="mm">毫米 mm</option><option value="m">米 m</option></select></label><button id="operator-cloud-import">导入点云</button></div><p id="operator-cloud-message" role="status"></p><table class="form-table"><tbody id="operator-cloud-metadata"></tbody></table><div id="operator-cloud-preview" hidden></div><p>文件坐标值不自动换算；请确认原始单位。单次运行与连续检测使用同一份导入数据。</p></details><section id="operator-continuous-panel" hidden aria-label="连续检测状态"><h2>连续检测</h2><p id="operator-continuous-policy"></p><table class="form-table"><tbody id="operator-continuous-stats"></tbody></table><p>关闭浏览器仍继续运行；服务重启后须手动启动。执行成功轮次不等于工件合格数量。</p></section><section id="hmi-runtime"><div class="hmi-runtime-heading"><h2 id="hmi-title">运行画面</h2><p id="hmi-state" role="status">等待方案</p></div><nav id="hmi-page-tabs" role="tablist" aria-label="运行画面页面"></nav><div class="operator-scroll"><div id="hmi-runtime-canvas" class="hmi-canvas"></div></div></section><p id="operator-empty" hidden>当前发布方案尚未组态运行画面，请由管理员补充。</p></main>
<footer><span id="status" role="status">仅运行已发布方案；设定值由组态画面开放。</span></footer><dialog id="hmi-editor" hidden></dialog>
<script src="data-presentation.js"></script><script src="form-editors.js"></script><script src="hmi-layout.js"></script><script src="monitor-chart.js"></script><script src="monitor-ui.js"></script><script src="hmi-pages.js"></script><script src="cloud-viewer.js"></script><script src="hmi-ui.js"></script><script src="operator-cloud-input.js"></script><script src="operator-page.js"></script></body></html>

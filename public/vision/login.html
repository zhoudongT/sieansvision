<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIEANS Vision · 登录</title><link rel="stylesheet" href="/auth/login.css"></head>
<body><main class="login-card"><div class="wordmark">SIEANS <small>VISION</small></div><h1>登录视觉平台</h1><p>使用管理员或操作员账号登录。</p><form id="login-form"><label>用户名<input id="username" name="username" autocomplete="username" maxlength="80" required autofocus></label><label>密码<input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required></label><button id="login-submit" type="submit">登录</button></form><p id="login-message" role="status" aria-live="polite"></p><p class="note">离开操作岗位前请退出登录。退出不会停止服务器正在执行的检测任务。</p></main><script src="/auth/login.js"></script></body></html>

<script type="text/javascript">+(function(){
 const catalog={"serial_exchange":{"name":"串口报文通信","tag":"扫码枪 · 测量仪 · 自定义报文","glyph":"⇄","defaults":{"connection":"simulator","mode":"exchange","serialPort":"","baudrate":115200,"dataBits":8,"parity":"N","stopbits":1,"flowControl":"none","rts":true,"dtr":true,"clearInput":false,"encoding":"text","responseEncoding":"text","timeoutMs":3000,"maxBytes":65536,"txFraming":"crlf","rxFraming":"crlf","responseBytes":8,"value":"SIEANS-SERIAL-00042"},"fields":[["connection","串口连接",["simulator","device"]],["mode","通信方式",["exchange","send","receive"]],["serialPort","服务器串口路径","text"],["baudrate","波特率",300,4000000],["dataBits","数据位",5,8],["parity","校验位",["N","E","O","M","S"]],["stopbits","停止位",1,2,0.5],["flowControl","流量控制",["none","rtscts","xonxoff","dsrdtr"]],["rts","打开时 RTS 状态","boolean"],["dtr","打开时 DTR 状态","boolean"],["encoding","发送内容格式",["text","structured","bytes"]],["responseEncoding","接收内容格式",["text","structured","bytes"]],["timeoutMs","通信超时 (ms)",100,10000,100],["maxBytes","接收字节上限",1,65536],["clearInput","发送前丢弃已有接收数据","boolean"],["txFraming","发送分帧方式",["raw","lf","crlf","nul","length16be","length16le","length32be","length32le"]],["rxFraming","接收完成条件",["lf","crlf","nul","length16be","length16le","length32be","length32le","fixed"]],["responseBytes","应答字节数",1,65536]],"description":"通过服务器上的串口与设备收发一帧报文。支持文本、结构化字段和字节表，以及结束符、长度头和定长分帧。回环模拟使用 pySerial 软件回环，不访问真实端口。","hint":"在工业通信面板刷新串口表，可选择到本模块。每次执行打开/关闭端口，与 Modbus RTU 互斥；打开端口可能改变 RTS/DTR。默认不丢弃已有输入。回环模式固定 115200、8N1、无流控，报文含头部最多 4096 字节。仅发送不表示设备已执行；无自动重试。"}},labels={...{"device":"实际串口设备","exchange":"发送并等待应答","send":"仅发送","receive":"仅接收","raw":"原始字节","lf":"换行 LF","crlf":"回车换行 CRLF","nul":"零字节结束","length16be":"2 字节长度 · 大端","length16le":"2 字节长度 · 小端","length32be":"4 字节长度 · 大端","length32le":"4 字节长度 · 小端","fixed":"固定字节数","eof":"对端结束发送","none":"无流控","rtscts":"RTS / CTS 硬件流控","xonxoff":"XON / XOFF 软件流控","dsrdtr":"DSR / DTR 硬件流控","M":"固定 1（Mark）","S":"固定 0（Space）","N":"无校验","E":"偶校验","O":"奇校验"},simulator:'软件回环模拟',text:'UTF-8 文本',structured:'结构化数据',bytes:'字节数组'};
  const types={number:'数值',string:'文本',boolean:'开关',array:'数组',object:'结构体',null:'空值'},initial={number:0,string:'',boolean:false,array:[],object:{},null:null};
 function typeOf(v){return v===null?'null':Array.isArray(v)?'array':typeof v;}
 function editor(value,change,label,depth=0){

  if(depth>=20)return box.append($('<p>').text('嵌套层级达到编辑上限'));
  if(kind==='array'||kind==='object'){
   const details=$('<details>').prop('open',depth===0).append($('<summary>').text(types[kind]+' · '+Object.keys(value).length+' 项')),body=$('<div>');box.append(details.append(body));
   const table=$('<table>').css({width:'100%',borderCollapse:'collapse'}).append($('<tr>').append($('<th>').text(kind==='array'?'序号':'字段'),$('<th>').text('类型与值'),$('<th>').text('操作')));body.append(table);let cursor=0;const keys=Object.keys(value),more=$('<button type="button">').text('显示更多');
   const append=()=>{for(const key of keys.slice(cursor,cursor+50)){const row=$('<tr>');row.append($('<td>').text(kind==='array'?Number(key)+1:key),$('<td>').append(editor(value[key],next=>{value[key]=next;change(value);},label+' '+key,depth+1)),$('<td>').append($('<button type="button">').text('删除').on('click',()=>{if(kind==='array')value.splice(Number(key),1);else delete value[key];change(value);box.replaceWith(editor(value,change,label,depth));})));table.append(row);}cursor+=50;more.toggle(cursor<keys.length);};more.on('click',append);append();body.append(more);
   const name=$('<input>').attr({placeholder:'字段名称','aria-label':label+'新字段'}).css('width','150px');if(kind==='object')body.append(name);
   body.append($('<button type="button">').text(kind==='array'?'添加元素':'添加字段').on('click',()=>{const key=kind==='array'?value.length:name.val().trim();if(kind==='object'&&(!key||['__proto__','constructor','prototype'].includes(key)||Object.hasOwn(value,key))){name[0].setCustomValidity('字段名为空、重复或为保留字');name[0].reportValidity();return;}value[key]=0;change(value);box.replaceWith(editor(value,change,label,depth));}));name.on('input',function(){this.setCustomValidity('');});

  $('<script>',{type:'text/html','data-template-name':type}).html(html).appendTo('body');
  $('<script>',{type:'text/html','data-help-name':type}).text(definition.description+' '+definition.hint).appendTo('body');
  RED.nodes.registerType(type,{category:'工业通信',color:'#86c6d9',paletteLabel:name,inputs:1,outputs:1,icon:'font-awesome/fa-exchange',label:function(){return this.name||name;},defaults:{name:{value:''},valueSource:{value:'message'},params:{value:JSON.stringify(definition.defaults),validate:function(v){try{const p={...definition.defaults,...JSON.parse(v)};return !!p&&['exchange','send','receive'].includes(p.mode)&&Number.isInteger(p.timeoutMs)&&p.timeoutMs>=100&&p.timeoutMs<=10000&&Number.isInteger(p.maxBytes)&&p.maxBytes>0&&p.maxBytes<=65536&&(p.connection==='simulator'?p.mode!=='receive':typeof p.serialPort==='string'&&p.serialPort.length>0);}catch{return false;}}}},
   oneditprepare:function(){
    const p={...definition.defaults,...JSON.parse(this.params||'{}')};if(!Object.hasOwn(JSON.parse(this.params||'{}'),'responseEncoding'))p.responseEncoding=p.encoding;this._serial=p;
    for(const [key,label,kind,max,step] of definition.fields){const input=Array.isArray(kind)?$('<select>'):$('<input>').attr('type',kind==='boolean'?'checkbox':kind==='text'?'text':'number');input.attr({id:'serial-'+key,'aria-label':label}).css('width','65%');if(Array.isArray(kind))for(const v of kind)input.append($('<option>').val(v).text(labels[v]||v));if(kind==='boolean')input.prop('checked',p[key]);else input.val(p[key]??'');if(typeof kind==='number')input.attr({min:kind,max,step:step||1,required:true});$('#serial-fields').append($('<div>').addClass('form-row').attr('data-key',key).append($('<label>').text(label).css('width','32%'),input));}
    $('#serial-value').append(editor(structuredClone(p.value),v=>p.value=v,'发送内容'));
    const visibility=()=>{const remote=$('#serial-connection').val()==='device',mode=$('#serial-mode').val(),fixed=$('#serial-rxFraming').val()==='fixed';$('#serial-fields [data-key]').each(function(){const key=$(this).attr('data-key');$(this).toggle(!((!remote&&['serialPort','baudrate','dataBits','parity','stopbits','flowControl','rts','dtr'].includes(key))||(mode==='receive'&&['txFraming','encoding','clearInput'].includes(key))||(mode==='send'&&['maxBytes','responseEncoding','rxFraming','responseBytes'].includes(key))||(key==='responseBytes'&&!fixed)||(key==='rts'&&$('#serial-flowControl').val()==='rtscts')||(key==='dtr'&&$('#serial-flowControl').val()==='dsrdtr')));});$('#serial-value-source').toggle(mode!=='receive');$('#serial-value').toggle(mode!=='receive'&&$('#node-input-valueSource').val()==='constant');};

   },
   oneditsave:function(){const p=this._serial;for(const [key,,kind] of definition.fields){const input=$('#serial-'+key);p[key]=kind==='boolean'?input.prop('checked'):typeof kind==='number'?(input.val()===''?null:Number(input.val())):input.val();}this.params=JSON.stringify(p);$('#node-input-params').val(this.params);delete this._serial;},oneditcancel:function(){delete this._serial;}
  });
 }
})();</script>

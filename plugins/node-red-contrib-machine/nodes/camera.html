<script type="text/html" data-template-name="machine-camera_capture">
 <div class="form-row"><label for="node-input-name">名称</label><input id="node-input-name" type="text"></div>
 <input id="node-input-params" type="hidden"><div id="machine-camera-fields"></div>
 <p>设备标识及 GenTL 驱动编号可从 SIEANS 工作台的相机设备表中选择并复制。UVC/GenTL 空白可选参数沿用设备当前值；深度相机使用表单默认值。GenTL 3D 要求 SFNC 标定栅格，按设备的分量索引配置亮度/置信度且确认对齐；输出毫米点云和预览图，不提供原始深度图。服务器运行相机采集；非浏览器摄像头。</p>
</script>
<script type="text/html" data-help-name="machine-camera_capture"><p>单次打开、设置、采集并释放。输出 msg.image 为 PNG，msg.camera / msg.payload 为采集元数据。深度设备额外输出 msg.depth（原始深度及标定）和 msg.cloud（毫米点云）；2D 设备清空旧深度/点云。msg.cameraParams 可覆盖配置。通过 Catch 节点接收错误；关闭节点中止子进程。GenTL 需配置 SIEANS_GENTL_CTI，触发和参数修改不会回滚。</p></script>
<script type="text/javascript">
(function(){
 const fields=[['sessionId','连续相机会话编号','text'],['framePolicy','缓存取帧策略',['next','latest']],['maxAgeMs','最大缓存帧龄 (ms)','number'],['driver','采集驱动',['simulator','uvc','gentl','realsense','orbbec','rgbd_simulator','session']],['dataMode','GenTL 输出',['image','pointcloud']],['configure3d','配置 Range 为标定 XYZ','boolean'],['coordinateFormat','XYZ 像素格式',['Coord3D_ABC32f','Coord3D_ABC32f_Planar','Coord3D_ABC16','Coord3D_ABC16_Planar']],['rangeComponent','XYZ 分量索引（-1 自动）','number'],['intensityComponent','亮度分量索引（-1 关闭）','number'],['confidenceComponent','置信度分量索引（-1 关闭）','number'],['confidenceThreshold','置信度最低原始值','number'],['alignedComponents','所选分量与 XYZ 逐像素对应','boolean'],['deviceId','设备标识','text'],['providerId','GenTL 驱动编号','text'],['trigger','触发模式',['freerun','software','external']],['triggerSource','触发线路',['Line0','Line1','Line2','Line3']],['timeoutMs','超时 (ms)','number'],['width','宽度','number'],['height','高度','number'],['fps','帧率','number'],['warmupFrames','预热帧数','number'],['exposureTime','曝光 (µs)','number'],['gain','增益','number'],['pixelFormat','像素格式','text'],['discoverNetwork','发现 Orbbec 网络设备','boolean'],['colorFormat','Orbbec 彩色格式',['RGB','BGR','MJPG','YUYV','UYVY','NV12','NV21']],['enableColor','同时采集彩色图','boolean'],['colorWidth','彩色宽度','number'],['colorHeight','彩色高度','number'],['pointStride','点云采样步长','number'],['minDepth','最近深度 (m)','number'],['maxDepth','最远深度 (m)','number']];
 function visible(key,p){if(['sessionId','framePolicy'].includes(key))return p.driver==='session';if(key==='maxAgeMs')return p.driver==='session'&&(p.framePolicy||'next')==='latest';if(p.driver==='session')return ['driver','timeoutMs'].includes(key);const xyz=p.driver==='gentl'&&p.dataMode==='pointcloud';if(key==='dataMode')return p.driver==='gentl';if(['configure3d','rangeComponent','intensityComponent','confidenceComponent'].includes(key))return xyz;if(key==='coordinateFormat')return xyz&&p.configure3d!==false;if(key==='confidenceThreshold')return xyz&&p.confidenceComponent>=0;if(key==='alignedComponents')return xyz&&(p.intensityComponent>=0||p.confidenceComponent>=0);if(key==='pixelFormat')return p.driver==='gentl'&&!xyz;if(key==='pointStride'&&xyz)return true;if(['providerId','exposureTime','gain','pixelFormat'].includes(key))return p.driver==='gentl';if(['fps','warmupFrames'].includes(key))return ['uvc','realsense','orbbec'].includes(p.driver);if(key==='trigger')return p.driver==='gentl';if(key==='triggerSource')return p.driver==='gentl'&&p.trigger==='external';if(key==='discoverNetwork')return p.driver==='orbbec';if(key==='colorFormat')return p.driver==='orbbec'&&p.enableColor!==false;if(key==='enableColor')return ['realsense','orbbec'].includes(p.driver);if(['colorWidth','colorHeight'].includes(key))return ['realsense','orbbec'].includes(p.driver)&&p.enableColor!==false;if(['pointStride','minDepth','maxDepth'].includes(key))return ['realsense','orbbec','rgbd_simulator'].includes(p.driver);if(['width','height'].includes(key)&&p.driver==='rgbd_simulator')return false;return true;}
 function defaultValue(p,key){if(p.driver==='session')return {framePolicy:'next',maxAgeMs:1000,timeoutMs:5000}[key]??'';if(p.driver==='gentl'&&Object.hasOwn({dataMode:'image',configure3d:true,coordinateFormat:'Coord3D_ABC32f',rangeComponent:-1,intensityComponent:-1,confidenceComponent:-1,confidenceThreshold:1,alignedComponents:false,pointStride:4},key))return {dataMode:'image',configure3d:true,coordinateFormat:'Coord3D_ABC32f',rangeComponent:-1,intensityComponent:-1,confidenceComponent:-1,confidenceThreshold:1,alignedComponents:false,pointStride:4}[key];const depth=['realsense','orbbec','rgbd_simulator'].includes(p.driver);if(depth){const defaults={width:640,height:480,fps:30,warmupFrames:5,colorWidth:640,colorHeight:480,pointStride:p.driver==='rgbd_simulator'?1:4,minDepth:.1,maxDepth:5};if(Object.hasOwn(defaults,key))return defaults[key];}return key==='driver'?'uvc':key==='trigger'?'freerun':key==='colorFormat'?'RGB':key==='timeoutMs'?5000:'';}
 RED.nodes.registerType('machine-camera_capture',{category:'相机采集',color:'#d1eef6',defaults:{name:{value:''},params:{value:'{"driver":"simulator","deviceId":"synthetic-parts","timeoutMs":5000,"trigger":"freerun"}'}},inputs:1,outputs:1,icon:'font-awesome/fa-camera',label:function(){return this.name||'相机采集';},
 oneditprepare:function(){const p=JSON.parse(this.params||'{}');const holder=$('#machine-camera-fields');const render=()=>{holder.empty();for(const [key,label,type]of fields){if(!visible(key,p))continue;const row=$('<div class="form-row">'),input=Array.isArray(type)?$('<select>'):$('<input>').attr('type',type==='boolean'?'checkbox':type);if(Array.isArray(type))for(const value of type)input.append($('<option>').val(value).text(({image:'2D 图像',pointcloud:'3D 标定点云',orbbec:'奥比中光 Orbbec 深度相机',realsense:'RealSense 深度相机',rgbd_simulator:'模拟深度相机',simulator:'模拟相机',session:'已连接连续相机',next:'等待下一帧',latest:'最新未过期缓存帧',uvc:'USB UVC',gentl:'GenTL 工业相机',freerun:'自由采集',software:'软件触发',external:'外部触发'})[value]||value));input.attr('aria-label',label).attr('step','any').val(p[key]??defaultValue(p,key));if(type==='boolean')input.prop('checked',p[key]??(!['discoverNetwork','alignedComponents'].includes(key)));input.on('change',()=>{if(type==='boolean')p[key]=input.prop('checked');else if(input.val()==='')delete p[key];else p[key]=type==='number'?Number(input.val()):input.val();if(key==='driver'){for(const k of ['sessionId','framePolicy','maxAgeMs','dataMode','configure3d','coordinateFormat','rangeComponent','intensityComponent','confidenceComponent','confidenceThreshold','alignedComponents','deviceId','providerId','fps','warmupFrames','exposureTime','gain','pixelFormat','triggerSource','width','height','enableColor','colorWidth','colorHeight','colorFormat','discoverNetwork','pointStride','minDepth','maxDepth'])delete p[k];if(p.driver==='session')delete p.trigger;else p.trigger='freerun';if(p.driver==='simulator')p.deviceId='synthetic-parts';if(p.driver==='rgbd_simulator')p.deviceId='synthetic-rgbd';render();}if(key==='dataMode'&&p.dataMode==='pointcloud')delete p.pixelFormat;if(['dataMode','configure3d','intensityComponent','confidenceComponent','trigger','framePolicy','enableColor'].includes(key))render();});row.append($('<label>').text(label),input);holder.append(row);}};this._cameraForm=p;render();},
 oneditsave:function(){this.params=JSON.stringify(this._cameraForm);$('#node-input-params').val(this.params);delete this._cameraForm;},oneditcancel:function(){delete this._cameraForm;}
 });
})();
</script>

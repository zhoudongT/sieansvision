<script type="text/javascript">+(function(){
 const catalog={"tcp_exchange":{"name":"TCP 报文通信","tag":"请求应答 · 报文分帧","glyph":"⇄","defaults":{"connection":"simulator","mode":"exchange","host":"127.0.0.1","port":9000,"encoding":"text","timeoutMs":3000,"maxBytes":65536,"value":"SIEANS 检测完成","txFraming":"crlf","rxFraming":"crlf","responseBytes":8},"fields":[["connection","通信设备",["simulator","device"]],["mode","通信方式",["exchange","send","receive"]],["host","远端 IP / 主机名","text"],["port","远端端口",1,65535],["encoding","消息内容格式",["text","structured","bytes"]],["timeoutMs","操作总超时 (ms)",100,60000,100],["maxBytes","接收字节上限",1,65536],["txFraming","发送分帧方式",["raw","lf","crlf","nul","length16be","length16le","length32be","length32le"]],["rxFraming","接收完成条件",["lf","crlf","nul","length16be","length16le","length32be","length32le","fixed","eof"]],["responseBytes","应答字节数",1,65536]],"description":"连接设备 TCP 服务，发送报文或等待一帧数据。自动拼接分段到达的数据，按所选规则识别完整报文。","hint":"每次执行创建并关闭连接；仅接收仍主动连接远端服务。长度前缀不计自身，结果移除前缀/结束符；定长按字节数。仅返回首帧，已收到的尾随字节计数显示在结果中。无自动重试，发送完成不代表设备已执行。"},"udp_exchange":{"name":"UDP 报文通信","tag":"单个数据报 · 对端筛选","glyph":"⇄","defaults":{"connection":"simulator","mode":"exchange","host":"127.0.0.1","port":9000,"encoding":"text","timeoutMs":3000,"maxBytes":65536,"value":"SIEANS 检测完成","localAddress":"","localPort":0},"fields":[["connection","通信设备",["simulator","device"]],["mode","通信方式",["exchange","send","receive"]],["host","远端 IP / 主机名","text"],["port","远端端口",1,65535],["encoding","消息内容格式",["text","structured","bytes"]],["timeoutMs","操作总超时 (ms)",100,60000,100],["maxBytes","接收字节上限",1,65536],["localAddress","本地 IP（空白自动选择）","text"],["localPort","本地 UDP 端口（0 自动）",0,65535]],"description":"发送一个 UDP 数据报，或接收来自指定设备的一条数据报。仅接收模式需要填写本地端口，其他模式可自动分配。","hint":"仅接收所配置远端 IP 和端口的数据；发送上限 65507 字节。UDP 不保证送达、顺序或不重复；请求应答建议在内容中携带事务编号。此节点不自动重试，不支持广播/组播。"}},labels={...{"device":"外部网络设备","exchange":"发送并等待应答","send":"仅发送","receive":"仅接收","raw":"原始字节","lf":"换行 LF","crlf":"回车换行 CRLF","nul":"零字节结束","length16be":"2 字节长度 · 大端","length16le":"2 字节长度 · 小端","length32be":"4 字节长度 · 大端","length32le":"4 字节长度 · 小端","fixed":"固定字节数","eof":"对端结束发送"},simulator:'本机回显设备',text:'UTF-8 文本',structured:'结构化数据',bytes:'字节数组'};
  const types={number:'数值',string:'文本',boolean:'开关',array:'数组',object:'结构体',null:'空值'},initial={number:0,string:'',boolean:false,array:[],object:{},null:null};
 function typeOf(v){return v===null?'null':Array.isArray(v)?'array':typeof v;}
 function editor(value,change,label,depth=0){
  const box=$('<div>').css({padding:'4px',minWidth:'120px'}),kind=typeOf(value),type=$('<select>').attr('aria-label',label+'类型').css('width','110px');
  Object.keys(types).forEach(k=>type.append($('<option>').val(k).text(types[k])));type.val(kind);box.append(type);
  type.on('change',function(){const next=structuredClone(initial[this.value]);change(next);box.replaceWith(editor(next,change,label,depth));});
  if(depth>=20)return box.append($('<p>').text('嵌套层级达到编辑上限'));
  if(kind==='array'||kind==='object'){
   const details=$('<details>').prop('open',depth===0).append($('<summary>').text(types[kind]+' · '+Object.keys(value).length+' 项')),body=$('<div>');box.append(details.append(body));
   const table=$('<table>').css({width:'100%',borderCollapse:'collapse'}).append($('<tr>').append($('<th>').text(kind==='array'?'序号':'字段'),$('<th>').text('类型与值'),$('<th>').text('操作')));body.append(table);let cursor=0;const keys=Object.keys(value),more=$('<button type="button">').text('显示更多');

   const name=$('<input>').attr({placeholder:'字段名称','aria-label':label+'新字段'}).css('width','150px');if(kind==='object')body.append(name);

  }else if(kind==='boolean')box.append($('<select>').attr('aria-label',label).css('width','100px').append($('<option>').val('true').text('是'),$('<option>').val('false').text('否')).val(String(value)).on('change',function(){change(this.value==='true');}));

 }

 for(const [operation,definition] of Object.entries(catalog)){

  const html='<div class="form-row"><label for="node-input-name">名称</label><input id="node-input-name"></div><input type="hidden" id="node-input-params"><div id="socket-fields"></div><div class="form-row" id="socket-value-source"><label>发送内容来源</label><select id="node-input-valueSource" aria-label="发送内容来源"><option value="message">输入消息内容</option><option value="constant">表单常量</option></select></div><div id="socket-value"></div><p>'+definition.hint+'</p><p>输出报文在 msg.payload.value，完整通信结果在 msg.industrial。动态参数通过 msg.industrialParams 提供。此节点使用普通 TCP/UDP，不启用 TLS。</p>';
  $('<script>',{type:'text/html','data-template-name':type}).html(html).appendTo('body');
  $('<script>',{type:'text/html','data-help-name':type}).text(definition.description+' '+definition.hint).appendTo('body');
  RED.nodes.registerType(type,{category:'工业通信',color:'#86c6d9',paletteLabel:name,inputs:1,outputs:1,icon:'font-awesome/fa-exchange',label:function(){return this.name||name;},defaults:{name:{value:''},valueSource:{value:'message'},params:{value:JSON.stringify(definition.defaults),validate:function(v){try{const p={...definition.defaults,...JSON.parse(v)};return !!p&&['exchange','send','receive'].includes(p.mode)&&Number.isInteger(p.timeoutMs)&&p.timeoutMs>=100&&p.timeoutMs<=60000&&Number.isInteger(p.maxBytes)&&p.maxBytes>0&&p.maxBytes<=65536&&(p.connection==='simulator'?p.mode!=='receive':typeof p.host==='string'&&p.host.length>0&&Number.isInteger(p.port)&&p.port>=1&&p.port<=65535);}catch{return false;}}}},
   oneditprepare:function(){
    const p={...definition.defaults,...JSON.parse(this.params||'{}')};this._socket=p;
    for(const [key,label,kind,max,step] of definition.fields){const input=Array.isArray(kind)?$('<select>'):$('<input>').attr('type',kind==='text'?'text':'number');input.attr({id:'socket-'+key,'aria-label':label}).css('width','65%');if(Array.isArray(kind))for(const v of kind)input.append($('<option>').val(v).text(labels[v]||v));input.val(p[key]??'');if(typeof kind==='number')input.attr({min:kind,max,step:step||1,required:true});$('#socket-fields').append($('<div>').addClass('form-row').attr('data-key',key).append($('<label>').text(label).css('width','32%'),input));}

    const visibility=()=>{const remote=$('#socket-connection').val()==='device',mode=$('#socket-mode').val(),fixed=$('#socket-rxFraming').val()==='fixed';$('#socket-fields [data-key]').each(function(){const key=$(this).attr('data-key');$(this).toggle(!((!remote&&['host','port','localAddress','localPort'].includes(key))||(mode==='receive'&&key==='txFraming')||(mode==='send'&&['maxBytes','rxFraming','responseBytes'].includes(key))||(key==='responseBytes'&&!fixed)));});$('#socket-value-source').toggle(mode!=='receive');$('#socket-value').toggle(mode!=='receive'&&$('#node-input-valueSource').val()==='constant');};
    $('#socket-fields select,#node-input-valueSource').on('change',visibility);visibility();
   },
   oneditsave:function(){const p=this._socket;for(const [key,,kind] of definition.fields){const input=$('#socket-'+key);p[key]=typeof kind==='number'?(input.val()===''?null:Number(input.val())):input.val();}this.params=JSON.stringify(p);$('#node-input-params').val(this.params);delete this._socket;},oneditcancel:function(){delete this._socket;}
  });
 }
})();</script>

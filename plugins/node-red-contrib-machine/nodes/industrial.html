<script type="text/javascript">
(function(){
 const names={opcua_wait:'等待 OPC UA 信号',modbus_wait:'等待 PLC 信号',s7_read:'S7 读取',s7_write:'S7 写入',modbus_read:'Modbus 读取',modbus_write:'Modbus 写入',opcua_browse:'OPC UA 浏览',opcua_read:'OPC UA 读取',opcua_write:'OPC UA 写入'};
 const uaTypes=['Boolean','SByte','Byte','Int16','UInt16','Int32','UInt32','Int64','UInt64','Float','Double','String','DateTime','Guid','ByteString'];
 const uaFields=[['connection','连接目标',['simulator','server']],['endpoint','服务器端点','text'],['security','安全策略',['None','Basic256Sha256']],['applicationUri','应用 URI','text'],['clientCertificate','客户端证书','text'],['privateKey','客户端私钥','text'],['serverCertificate','服务器证书','text'],['username','用户名','text'],['passwordEnv','密码环境变量','text'],['namespaceUri','命名空间 URI','text'],['nodeId','节点地址','text']];
 const mbFields=[['transport','连接方式',['simulator','tcp','rtu']],['host','主机','text'],['port','端口','number'],['serialPort','串口路径','text'],['baudrate','波特率','number'],['parity','校验',['N','E','O']],['stopbits','停止位','number'],['deviceId','站号','number'],['area','数据区域',['holding','input','coils','discrete']],['address','起始地址','number'],['dataType','数值类型',['uint16','int16','uint32','int32','float32','float64']],['byteOrder','字节序',['big','little']],['wordOrder','字序',['big','little']]];
 const s7Fields=[['connection','连接方式',['simulator','plc']],['host','设备主机','text'],['port','TCP 端口','number'],['rack','机架号','number'],['slot','槽号','number'],['area','数据区域',['db','mk','pe','pa']],['dbNumber','数据块编号','number'],['byteOffset','字节偏移','number'],['bitOffset','位偏移','number'],['dataType','数据类型',['bool','uint8','int8','uint16','int16','uint32','int32','float32','float64']]];
 const labels={eq:'等于',ne:'不等于',gt:'大于',gte:'大于等于',lt:'小于',lte:'小于等于',is_true:'开关为是',is_false:'开关为否',level:'条件成立',rising:'条件由不成立变为成立',falling:'条件由成立变为不成立',error:'报错并停止',continue:'输出未触发并继续',plc:'西门子 PLC',db:'数据块 DB',mk:'中间存储 M',pe:'输入区 I',pa:'输出区 Q',bool:'开关 BOOL',simulator:'本机模拟设备',server:'OPC UA 服务器',None:'匿名无加密',Basic256Sha256:'签名并加密',tcp:'TCP',rtu:'串口 RTU',holding:'保持寄存器',input:'输入寄存器',coils:'线圈',discrete:'离散输入',big:'大端',little:'小端'};
 Object.keys(names).forEach(function(operation){
  const waiting=operation==='modbus_wait';
  const isUA=operation.startsWith('opcua_'),isS7=operation.startsWith('s7_'),write=operation.endsWith('_write'),type='machine-'+operation;
  const defaults=isS7?{connection:'simulator',host:'127.0.0.1',port:102,rack:0,slot:1,area:'db',dbNumber:1,byteOffset:write?10:0,bitOffset:0,dataType:'uint16',count:1,value:0,timeoutMs:3000}:isUA?{connection:'simulator',endpoint:'opc.tcp://127.0.0.1:4840/',security:'None',applicationUri:'urn:sieans:vision:client',nodeId:operation==='opcua_browse'?'ns=2;s=SIEANS':'ns=2;s=SIEANS.Count',timeoutMs:3000,requireGood:true,browseLimit:100,dataType:'UInt32',value:0}:{transport:'simulator',host:'127.0.0.1',port:502,serialPort:'',baudrate:19200,parity:'N',stopbits:1,area:'holding',address:write?10:0,deviceId:1,dataType:'uint16',byteOrder:'big',wordOrder:'big',timeoutMs:1500,count:1,value:0};
  if(waiting)Object.assign(defaults,{comparison:'eq',expectedValue:123,triggerMode:'level',pollIntervalMs:100,stableMs:0,waitTimeoutMs:10000,onTimeout:'error'});
  if(operation==='opcua_wait')Object.assign(defaults,{comparison:'eq',expectedValue:0,triggerMode:'level',publishingIntervalMs:100,waitTimeoutMs:10000,onTimeout:'error'});
  const fields=(isS7?s7Fields:isUA?uaFields:mbFields).slice();
  if(operation==='opcua_wait')fields.push(['comparison','信号条件',['eq','ne','gt','gte','lt','lte','is_true','is_false']],['expectedValue','比较值','number'],['triggerMode','触发方式',['level','rising','falling']],['publishingIntervalMs','请求采样/发布间隔 (ms)','number'],['waitTimeoutMs','等待超时 (ms)','number'],['onTimeout','超时处理',['error','continue']]);
  if(operation==='opcua_browse')fields.push(['browseLimit','浏览上限','number']);
  if(operation==='opcua_read')fields.push(['requireGood','仅良好质量','checkbox']);
  if(operation==='opcua_write')fields.push(['dataType','节点值类型',uaTypes]);
  if(operation==='modbus_read'||operation==='s7_read')fields.push(['count','读取值数量','number']);
  fields.push(['timeoutMs','通信超时 (ms)','number']);
  if(waiting)fields.push(['comparison','信号条件',['eq','ne','gt','gte','lt','lte','is_true','is_false']],['expectedValue','比较值','number'],['triggerMode','触发方式',['level','rising','falling']],['pollIntervalMs','采样间隔 (ms)','number'],['stableMs','采样稳定时间 (ms)','number'],['waitTimeoutMs','等待超时 (ms)','number'],['onTimeout','超时处理',['error','continue']]);
  let html='<div class="form-row"><label for="node-input-name">名称</label><input id="node-input-name"></div><input id="node-input-params" type="hidden"><div id="machine-io-fields"></div>';
  if(write)html+='<div class="form-row"><label>写入形式</label><select id="machine-value-shape" aria-label="写入形式"><option value="single">单值</option><option value="array">数组</option></select></div><table id="machine-values" style="width:100%"><thead><tr><th>类型</th><th>值</th><th>操作</th></tr></thead><tbody></tbody></table><button type="button" id="machine-add-value">添加数组元素</button>';
  if(operation==='opcua_wait')html+='<p>单节点有界订阅，每次重新建立基线；只接受良好质量。短脉冲可能遗漏，溢出/断线失败；超时继续必须检查 triggered，关闭或部署节点取消等待。</p>';
  if(waiting)html+='<p>单连接轮询，可能漏掉短脉冲；边沿每次重新建立基线。稳定时间只验证连续采样。超时继续时须检查 triggered。通信错误通过 Catch 处理；部署/关闭节点取消等待。</p>';
  html+='<p>动态参数由 msg.industrialParams 提供；输出在 msg.payload，完整信息在 msg.industrial。写入不重试，设备动作不能回滚。</p>';
  $('<script>',{type:'text/html','data-template-name':type}).html(html).appendTo('body');
  $('<script>',{type:'text/html','data-help-name':type}).html('<p>'+names[operation]+(isS7?'。经典 S7 访问；BOOL 为单个位，数值单次最多 200 字节。1200/1500 需要对应 PUT/GET 和非优化 DB 配置。':'。64 位整数用十进制文本，认证密码从服务器环境变量读取。')+'使用 Catch 处理错误；模拟器仅在本机运行。</p>').appendTo('body');
  RED.nodes.registerType(type,{category:'工业通信',color:'#86c6d9',paletteLabel:names[operation],defaults:{name:{value:''},params:{value:JSON.stringify(defaults),validate:function(value){try{const p=JSON.parse(value);return p&&typeof p==='object'&&!Array.isArray(p);}catch(e){return false;}}}},inputs:1,outputs:1,icon:'font-awesome/fa-exchange',label:function(){return this.name||names[operation];},
   oneditprepare:function(){
    const p=JSON.parse(this.params||'{}');if(isS7){if(p.connection===undefined)p.connection='plc';}else if(isUA){if(p.connection===undefined)p.connection='server';if(p.dataType===undefined)p.dataType='Double';if(p.nodeId===undefined)p.nodeId=operation==='opcua_browse'?'i=85':'';if(p.endpoint===undefined)p.endpoint='';}else if(p.transport===undefined)p.transport='tcp';this._ioOriginal=p;
    fields.forEach(function(f){const input=Array.isArray(f[2])?$('<select>'):$('<input>',{type:f[2]});input.attr('id','machine-io-'+f[0]).attr('aria-label',f[1]);if(Array.isArray(f[2]))f[2].forEach(function(v){if(write&&f[0]==='area'&&['input','discrete','pe'].includes(v))return;input.append($('<option>',{value:v,text:labels[v]||v}));});if(f[2]==='checkbox')input.prop('checked',p[f[0]]===undefined?defaults[f[0]]:p[f[0]]);else input.val(p[f[0]]===undefined?defaults[f[0]]:p[f[0]]);input.css('width','68%');$('#machine-io-fields').append($('<div>',{class:'form-row','data-field':f[0]}).append($('<label>',{text:f[1]}).css('width','28%'),input));});
    function visibility(){const mode=$('#machine-io-connection').val(),transport=$('#machine-io-transport').val(),secure=$('#machine-io-security').val()==='Basic256Sha256';fields.forEach(function(f){let show=true;if(isS7){if(['host','port','rack','slot'].includes(f[0]))show=mode!=='simulator';if(f[0]==='dbNumber')show=$('#machine-io-area').val()==='db';if(f[0]==='bitOffset')show=$('#machine-io-dataType').val()==='bool';if(f[0]==='count')show=$('#machine-io-dataType').val()!=='bool';}else if(isUA){if(operation==='opcua_wait'&&f[0]==='expectedValue')show=!['is_true','is_false'].includes($('#machine-io-comparison').val());if(['endpoint','security','namespaceUri'].includes(f[0]))show=mode!=='simulator';if(['applicationUri','clientCertificate','privateKey','serverCertificate','username','passwordEnv'].includes(f[0]))show=mode!=='simulator'&&secure;}else{if(['host','port'].includes(f[0]))show=transport==='tcp';if(['dataType','byteOrder','wordOrder'].includes(f[0]))show=!['coils','discrete'].includes($('#machine-io-area').val());if(waiting&&f[0]==='expectedValue')show=!['is_true','is_false'].includes($('#machine-io-comparison').val());if(['serialPort','baudrate','parity','stopbits'].includes(f[0]))show=transport==='rtu';}$('#machine-io-fields [data-field="'+f[0]+'"]').toggle(show);});}
    if(waiting)$('#machine-io-area').on('change',()=>{$('#machine-io-comparison').val(['coils','discrete'].includes($('#machine-io-area').val())?'is_true':'eq');});
    $('#machine-io-fields select').on('change',visibility);visibility();
    if(write){
     const values=p.values===undefined?p.value:p.values;$('#machine-value-shape').val(Array.isArray(values)?'array':'single');
     function addValue(value){const row=$('<tr>'),kind=$('<select>',{class:'value-kind','aria-label':'写入元素类型'}).append('<option value="number">数值</option><option value="string">文本</option><option value="boolean">开关</option>'),input=$('<input>',{class:'value-input',step:'any','aria-label':'写入元素值'}),flag=$('<select>',{class:'value-flag','aria-label':'写入元素开关'}).append('<option value="true">是</option><option value="false">否</option>'),remove=$('<button>',{type:'button',text:'删除'});kind.val(typeof value);input.val(String(value));flag.val(value===true?'true':'false');function update(){input.toggle(kind.val()!=='boolean');flag.toggle(kind.val()==='boolean');input.attr('type',kind.val()==='number'?'number':'text');}kind.on('change',update);update();remove.on('click',()=>row.remove());row.append($('<td>').append(kind),$('<td>').append(input,flag),$('<td>').append(remove));$('#machine-values tbody').append(row);}
     (Array.isArray(values)?values:[values===undefined?0:values]).forEach(addValue);
     $('#machine-add-value').on('click',()=>addValue(0));
     $('#machine-value-shape').on('change',function(){$('#machine-add-value').toggle(this.value==='array');if(this.value==='single'){const rows=$('#machine-values tbody tr');rows.slice(1).remove();if(!rows.length)addValue(0);}}).trigger('change');
    }
   },
   oneditsave:function(){const p=Object.assign({},this._ioOriginal);fields.forEach(function(f){const input=$('#machine-io-'+f[0]),v=input.val();if(f[2]==='checkbox')p[f[0]]=input.prop('checked');else if(v==='')delete p[f[0]];else p[f[0]]=f[2]==='number'?Number(v):v;});if(write){const values=[];$('#machine-values tbody tr').each(function(){const kind=$(this).find('.value-kind').val(),v=$(this).find('.value-input').val();values.push(kind==='number'?(v.trim()===''?null:Number(v)):kind==='boolean'?$(this).find('.value-flag').val()==='true':v);});delete p.values;p.value=$('#machine-value-shape').val()==='array'?values:values[0];}if(isS7&&p.dataType==='bool')p.count=1;if(isUA&&p.security==='None'){delete p.username;delete p.passwordEnv;}this.params=JSON.stringify(p);$('#node-input-params').val(this.params);delete this._ioOriginal;},oneditcancel:function(){delete this._ioOriginal;}
  });
 });
})();
</script>
